spring.application.name=api-gateway
server.port=8080

jwt.secret=${JWT_SECRET}

spring.cloud.gateway.server.webmvc.routes[0].id=auth-service
spring.cloud.gateway.server.webmvc.routes[0].uri=http://${AUTH_SERVICE_HOST:localhost}:8081
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/auth/**

spring.cloud.gateway.server.webmvc.routes[1].id=ideas-service
spring.cloud.gateway.server.webmvc.routes[1].uri=http://${IDEAS_SERVICE_HOST:localhost}:8082
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/idea/**,/ai/**

app.cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:5500,http://127.0.0.1:5500}